<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">
        <h:outputStylesheet library="knife" name="css/knife_list.css"/><!-- Automatically relocated to head. -->

        <article class="text--justified">
            <header><h2>Knives</h2></header>

            <h:dataTable value="#{knifeList.knives.knives}" var="knife"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    <h:outputText value="#{knife.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">View</f:facet>
                    <h:link outcome="/knife/knife_view.xhtml" value="View">
                        <f:param name="id" value="#{knife.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Edit</f:facet>
                    <h:link outcome="/knife/knife_edit.xhtml" value="Edit">
                        <f:param name="id" value="#{knife.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Delete</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="Delete"
                                         action="#{knifeList.deleteAction(knife)}"/>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button styleClass="btn" outcome="/knife/knife_create__basic.xhtml"
                              value="Create new knife"/>
                </f:facet>

            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
