<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{categoryView.id}" required="true"/>
        <f:viewAction action="#{categoryView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2><h:outputText value="#{categoryView.category.name}"/></h2></header>
            <div class="container">
                <div class="row">
                    <div class="col-4">
                        <div class="row mb-2">
                            <div class="col-6 fw-bold">
                                Description
                            </div>
                            <div class="col-6 ">
                                <h:outputText value="#{categoryView.category.description}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 fw-bold mt-5">
                Related Knives
            </div>
            <h:dataTable value="#{knifeList.getCategoryKnives(categoryView.id).knives}" var="knife"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                <h:column>
                    <f:facet name="header">Name</f:facet>
                    <h:outputText value="#{knife.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">View</f:facet>
                    <h:link outcome="/knife/knife_view.xhtml" value="View">
                        <f:param name="id" value="#{knife.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Edit</f:facet>
                    <h:link outcome="/knife/knife_edit.xhtml" value="Edit">
                        <f:param name="id" value="#{knife.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">Delete</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="Delete"
                                         action="#{knifeList.deleteAction(knife)}"/>
                    </h:form>
                </h:column>

            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
