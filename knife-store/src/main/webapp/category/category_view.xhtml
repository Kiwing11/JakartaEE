<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{categoryView.id}" required="true"/>
        <f:viewAction action="#{categoryView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2><h:outputText value="#{categoryView.category.name}"/></h2></header>
            <div class="container">
                <div class="row">
                    <div class="col-4">
                        <div class="row mb-2">
                            <div class="col-6 fw-bold">
                                #{msg.knifeDescription}
                            </div>
                            <div class="col-6 ">
                                <h:outputText value="#{categoryView.category.description}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-6 fw-bold mt-5">
                #{msg.relatedKnives}
            </div>
            <h:dataTable id="knifeTable" value="#{knifeList.getCategoryKnives(categoryView.id).knives}" var="knife"
                         styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                <h:column>
                    <f:facet name="header">#{msg.name}</f:facet>
                    <h:outputText value="#{knife.name}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg.version}</f:facet>
                    <h:outputText value="#{knife.version}"/>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg.created}</f:facet>
                    <h:outputText value="#{knife.creationDateTime}">
                        <f:convertDateTime type="localDateTime" pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg.updated}</f:facet>
                    <h:outputText value="#{knife.editionDateTime}">
                        <f:convertDateTime type="localDateTime" pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </h:column>


                <h:column>
                    <f:facet name="header">#{msg.view}</f:facet>
                    <h:link outcome="/knife/knife_view.xhtml" value="#{msg.view}">
                        <f:param name="id" value="#{knife.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg.edit}</f:facet>
                    <h:link outcome="/knife/knife_edit.xhtml" value="#{msg.edit}">
                        <f:param name="id" value="#{knife.id}"/>
                    </h:link>
                </h:column>

                <h:column>
                    <f:facet name="header">#{msg.delete}</f:facet>
                    <h:form>
                        <h:commandButton styleClass="btn" value="#{msg.delete}"
                                         actionListener="#{knifeList.deleteAction(knife)}">
                            <f:ajax execute="@this" render=":knifeTable"/>
                        </h:commandButton>
                    </h:form>
                </h:column>

                <f:facet name="footer">
                    <h:button styleClass="btn" outcome="/knife/knife_create__basic.xhtml"
                              value="#{msg.newKnife}"/>
                </f:facet>

            </h:dataTable>
        </article>
    </ui:define>

</ui:composition>
