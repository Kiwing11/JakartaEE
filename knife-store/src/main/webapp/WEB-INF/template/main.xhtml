<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
    <f:view>
        <h:head>
            <meta charset="UTF-8"/>
            <meta name="description" content="Knife Store"/>
            <meta name="keywords" content="Knife Store"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>Knife Store</title>

            <h:outputStylesheet library="webjars" name="mdb-ui-kit/6.4.0/css/mdb.min.css"/>
            <h:outputStylesheet library="default" name="css/main.css"/>
            <h:outputScript library="webjars" name="mdb-ui-kit/6.4.0/js/mdb.min.js"/>
            <h:outputScript library="mdb" name="js/main.js" target="body"/>
        </h:head>

        <h:body>
            <div class="container">
                <header class="mb-4 mt-4">
                    <h:link outcome="/index.xhtml">
                        <h:graphicImage name="header.png" styleClass="mw-100" alt="Header"></h:graphicImage>
                    </h:link>
                </header>

                <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
                    <div class="container-fluid">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 justify-content-around w-100">
                            <li class="nav-item">
                                <h:link styleClass="nav-link" outcome="/index.xhtml">Home</h:link>
                            </li>
                            <li class="nav-item">
                                <h:link styleClass="nav-link"
                                        outcome="/knife/knife_list.xhtml">Knives</h:link>
                            </li>
                            <li class="nav-item">
                                <h:link styleClass="nav-link"
                                        outcome="/category/category_list.xhtml">Categories</h:link>
                            </li>
                        </ul>
                    </div>
                </nav>

                <main class="mb-4 mt-4">
                    <ui:insert name="content"/>
                </main>

                <footer class="text-center text-lg-start bg-light text-muted p-2">
                    <div class="text-center">
                        Copyright &#169; 2024, 188918
                    </div>
                    <div class="text-center">
                        PG
                    </div>
                </footer>
            </div>
        </h:body>
    </f:view>
</html>
