<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
    <f:view>
        <h:head>
            <meta charset="UTF-8"/>
            <meta name="description" content="Knife Store"/>
            <meta name="keywords" content="Knife Store"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>Knife Store</title>

            <h:outputStylesheet library="webjars" name="mdb-ui-kit/6.4.0/css/mdb.min.css"/>
            <h:outputStylesheet library="default" name="css/main.css"/>
            <h:outputScript library="webjars" name="mdb-ui-kit/6.4.0/js/mdb.min.js"/>
            <h:outputScript library="mdb" name="js/main.js" target="body"/>
        </h:head>

        <h:body>
            <div class="container">
                <header class="mb-4 mt-4">
                    <h:link outcome="/index.xhtml">
                        <h:graphicImage name="header.png" styleClass="mw-100" alt="Header"></h:graphicImage>
                    </h:link>

                    <div class="container d-flex align-items-center justify-content-end" style="flex-direction: row;">
                        <div class="container d-flex align-items-center justify-content-end">
                            <h:form styleClass="container d-flex  align-items-center justify-content-end"
                                    rendered="#{facesContext.externalContext.userPrincipal != null}">
                                #{msg.logged}: <h:outputText
                                    value="#{facesContext.externalContext.userPrincipal.name}"/>
                                <h:commandButton styleClass="btn btn-link" value="#{msg.logout}"
                                                 action="#{userLogout.logoutAction()}"/>
                            </h:form>
                        </div>
<!--                        <h:graphicImage width="50px" rendered="#{facesContext.viewRoot.locale.language == 'pl'}"-->
<!--                                        value="https://cdn.pixabay.com/photo/2018/06/02/05/17/poland-3447820_1280.png"/>-->
<!--                        <h:graphicImage width="50px" rendered="#{facesContext.viewRoot.locale.language != 'pl'}"-->
<!--                                        value="https://e7.pngegg.com/pngimages/559/44/png-clipart-european-union-flag-of-the-united-kingdom-british-flag-logo-thumbnail.png"/>-->
                    </div>
                </header>

                <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
                    <div class="container-fluid">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0 justify-content-around w-100">
                            <li class="nav-item">
                                <h:link styleClass="nav-link" outcome="/index.xhtml">Home</h:link>
                            </li>
<!--                            <li class="nav-item">-->
<!--                                <h:link styleClass="nav-link"-->
<!--                                        outcome="/knife/knife_list.xhtml">Knives</h:link>-->
<!--                            </li>-->
<!--                            <h:panelGroup rendered="#{facesContext.externalContext.isUserInRole('user')}">-->
                                <li class="nav-item">
                                    <h:link styleClass="nav-link"
                                            outcome="/category/category_list.xhtml">#{msg.categories}</h:link>
                                </li>
<!--                            </h:panelGroup>-->
<!--                            <h:panelGroup rendered="#{facesContext.externalContext.userPrincipal == null}">-->
<!--                                <li class="nav-item">-->
<!--                                    <h:link styleClass="nav-link"-->
<!--                                            outcome="/authentication/custom/login.xhtml">#{msg.login}</h:link>-->
<!--                                </li>-->
<!--                            </h:panelGroup>-->
                        </ul>
                    </div>
                </nav>

                <main class="mb-4 mt-4">
                    <ui:insert name="content"/>
                </main>

                <footer class="text-center text-lg-start bg-light text-muted p-2">
                    <div class="text-center">
                        Copyright &#169; 2024, 188918
                    </div>
                    <div class="text-center">
                        PG
                    </div>
                </footer>
            </div>
        </h:body>
    </f:view>
</html>
